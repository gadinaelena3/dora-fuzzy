# One-command reproduction:
#   docker compose up
#
# Then visit:
#   http://localhost:5173   -> React UI
#   http://localhost:8000   -> FastAPI service
#   http://localhost:8000/docs -> Auto-generated OpenAPI docs

services:
  backend:
    build: ./backend
    container_name: fuzzy-dss-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: fuzzy-dss-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
